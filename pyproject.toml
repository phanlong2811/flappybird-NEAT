[project]
name = "neat-pipe-dodger"
version = "0.1.0"
description = "NEAT to build an intelligent agent playing a pipe-dodging game"
requires-python = ">=3.10"
dependencies = ["neat-python>=2,<3", "pygame>=2.6"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
